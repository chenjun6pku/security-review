name: validate-skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    # Scripts require Python 3.10+ (PEP 604 unions); the ubuntu-latest image provides 3.12.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Confirm Python version floor
        run: python3 -c "import sys; assert sys.version_info >= (3, 10), sys.version"
      - name: Validate rules, fixtures, and skill metadata
        run: python3 scripts/validate_rules.py
      - name: Run scanner pattern regression cases
        run: python3 scripts/run_scan_tests.py
